name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  # The merge queue tests each PR stacked on the ones ahead of it, which is the
  # only place two migrations written in parallel meet before main.
  merge_group:

# A new push to the same ref makes in-flight runs irrelevant, so cancel them.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend

      - run: make format-check

      - run: make tidy-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: make test-cover

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  migrations:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.3.3

      # atlas.sum is gitignored so parallel migrations never conflict on it;
      # hash the directory as it stands, then replay it on a scratch database.
      - run: atlas migrate hash --env local

      - run: atlas migrate validate --env local

      # What a committed atlas.sum used to guarantee, checked against the base
      # instead: applied migrations are never edited, and new ones sort after
      # everything already on main, or `migrate apply` rejects them as out of order.
      - name: Migrations are append-only
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"

          edited=$(git diff --name-only --diff-filter=MDR "$BASE_SHA" HEAD -- 'migrations/*.sql')
          if [ -n "$edited" ]; then
            echo "$edited"
            echo "::error::migrations already on main were edited, renamed, or deleted — add a new migration instead"
            exit 1
          fi

          latest=$(git ls-tree --name-only "$BASE_SHA" migrations/ | grep '\.sql$' | sort | tail -n 1)
          latest_version=$(basename "${latest%%_*}")
          for file in $(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'migrations/*.sql'); do
            version=$(basename "${file%%_*}")
            if [[ ! "$version" > "$latest_version" ]]; then
              echo "::error file=$file::version $version is not newer than $latest_version on main — rename it with a later timestamp"
              exit 1
            fi
          done

      # Diffing the gorm models against ./migrations writes a file only when the
      # two disagree, so a dirty tree here means a model changed without a
      # migration — or a new model was never registered in cmd/atlasloader.
      - name: Models match the migration directory
        run: |
          atlas migrate diff ci_drift --env local
          if [ -n "$(git status --porcelain migrations)" ]; then
            git status --porcelain migrations
            echo "::error::gorm models and ./migrations disagree — run 'make migrate-new NAME=what_changed' and commit the result"
            exit 1
          fi

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The deployable artifact, and the only check that the Dockerfile's
      # pinned Go version still builds this code.
      - run: docker build --tag boutline:${{ github.sha }} .
