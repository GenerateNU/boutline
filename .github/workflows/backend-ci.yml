name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# A new push to the same ref makes in-flight runs irrelevant, so cancel them.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend

      - run: make format-check

      - run: make tidy-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: make test-cover

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: ignore

  migrations:
    name: Schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.3.3

      # atlas.hcl's dev container needs pg_trgm already in template1 (see
      # atlas/dev-db) so it can validate the trigram indexes without
      # declaring the extension itself, which Atlas Community blocks. Tagged
      # to match what atlas's docker://postgres/17-trgm/dev url pulls.
      - run: docker build --tag postgres:17-trgm atlas/dev-db

      # Checksum integrity: catches a hand-edited migration that was never
      # re-signed with `atlas migrate hash`.
      - run: atlas migrate validate --env local

      # Diffing the gorm models against ./migrations writes a file only when the
      # two disagree, so a dirty tree here means a model changed without a
      # migration — or a new model was never registered in cmd/atlasloader.
      - name: Models match the migration directory
        run: |
          atlas migrate diff ci_drift --env local
          if [ -n "$(git status --porcelain migrations)" ]; then
            git status --porcelain migrations
            echo "::error::gorm models and ./migrations disagree — run 'make migrate-new NAME=what_changed' and commit the result"
            exit 1
          fi

      # schema.md is generated from the same models, so it goes stale the same
      # way. --porcelain rather than git diff so a never-committed file fails too.
      - name: schema.md matches the models
        run: |
          make schema-diagram
          if [ -n "$(git status --porcelain schema.md)" ]; then
            git diff schema.md
            echo "::error::schema.md is out of date — run 'make schema-diagram' and commit the result"
            exit 1
          fi

  seed:
    name: Seed data
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: boutline
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boutline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/boutline?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: ariga/setup-atlas@v0
        with:
          version: v1.3.3

      - run: atlas migrate apply --dir file://migrations --url "$DATABASE_URL"

      # The counts are built from pg_tables, so a new table is covered without
      # touching this job: it fails until seeds/seed.sql gives that table rows.
      # The second run must change nothing, which catches a row added without
      # a fixed id.
      - name: Seed applies, covers every table, and reruns cleanly
        run: |
          count_rows() {
            psql "$DATABASE_URL" -At -c "SELECT string_agg(format('SELECT %L, count(*) FROM %I', tablename, tablename), ' UNION ALL ' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public'" \
              | psql "$DATABASE_URL" -At
          }

          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f seeds/seed.sql
          first=$(count_rows)
          echo "$first"

          empty=$(echo "$first" | awk -F'|' '$2 == 0 { print $1 }')
          if [ -n "$empty" ]; then
            echo "::error::seeds/seed.sql leaves these tables empty: $empty"
            exit 1
          fi

          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 -f seeds/seed.sql
          if [ "$(count_rows)" != "$first" ]; then
            echo "::error::a second seed run inserted rows — give every seeded row a fixed id"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # DB_* defaults in internal/config already match this job's postgres
      # service (localhost:5432, db boutline, user/password postgres,
      # sslmode disable), so no env is needed beyond what Go test picks up.
      - env:
          REQUIRE_DB: "1"
        run: go test ./internal/tests/... -race

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The deployable artifact, and the only check that the Dockerfile's
      # pinned Go version still builds this code.
      - run: docker build --tag boutline:${{ github.sha }} .
