# Production deploy: backend to the shared droplet, frontend to Vercel.
#
# Publishing a GitHub Release ships both halves together. The image is built
# from the exact commit the tag points at, so what ships is always what was
# tagged.
#
# Postgres runs on the droplet too, so migrations run here: the compose stack
# applies them before the new backend starts.
name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or SHA to deploy (use an older tag to roll back)
        required: true
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend and frontend
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_FRONTEND_URL }}
    steps:
      - name: Check out the ref being deployed
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # github.sha points at the workflow's own ref, not the one checked out,
      # so a manual deploy of an older tag would otherwise be mislabelled.
      - name: Resolve the deployed commit
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # GHCR repository names must be lowercase, but github.repository keeps the
      # org's capitalisation (GenerateNU), which buildx rejects outright.
      - name: Compute the image repository
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The default `docker` driver cannot export the GHA build cache below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPO }}/backend:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migration image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.migrate
          push: true
          tags: ${{ env.IMAGE_REPO }}/migrate:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key stops a machine impersonating the droplet from
          # harvesting the deploy key; StrictHostKeyChecking=no would accept any.
          echo "${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the backend
        env:
          DROPLET: ${{ vars.DROPLET_USER }}@${{ vars.DROPLET_HOST }}
          IMAGE: ${{ env.IMAGE_REPO }}/backend:${{ env.DEPLOY_SHA }}
          MIGRATE_IMAGE: ${{ env.IMAGE_REPO }}/migrate:${{ env.DEPLOY_SHA }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          set -euo pipefail
          ssh "$DROPLET" 'test -r /opt/boutline/backend.env' || {
            echo "::error::/opt/boutline/backend.env is missing on the droplet. See deploy/README.md."
            exit 1
          }

          # Old <sha> tags are not dangling, so `docker image prune` alone keeps
          # every release's images forever -- that filled the shared disk once.
          # This removes boutline's release images by name instead of with
          # `prune -a`, which acts on every project's images on the droplet.
          # Images any container uses are skipped by ID: when several tags share
          # one image (a preview and a release built from the same commit),
          # `docker rmi` of one tag only untags it, even while a container runs
          # it. `prune -f` takes dangling images, such as a postgres or redis
          # image that `--pull always` replaced. PR previews' pr-* tags are
          # theirs to clean up. Run before the pulls as well, so a nearly full
          # disk cannot fail a pull before cleanup is reached.
          remove_unused_images() {
            ssh "$DROPLET" bash -s -- "$IMAGE" "$MIGRATE_IMAGE" <<'EOF'
          docker images --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' \
            | grep -E " (${1%:*}|${2%:*}):" \
            | grep -v ':pr-' \
            | grep -vFf <(docker ps -aq | xargs -r docker inspect -f '{{.Image}}') \
            | cut -d' ' -f2 \
            | xargs -r docker rmi >/dev/null 2>&1 || true
          docker image prune -f >/dev/null
          EOF
          }
          remove_unused_images

          # Ship the compose file too, so the droplet runs what this commit
          # describes rather than drifting from a hand-edited copy.
          scp deploy/app/docker-compose.yml "$DROPLET:/opt/boutline/docker-compose.yml"
          # Migrations first, as their own step: if they fail, the && chain
          # stops before `up` and the old backend keeps serving.
          ssh "$DROPLET" \
            "cd /opt/boutline \
             && export BACKEND_IMAGE='$IMAGE' MIGRATE_IMAGE='$MIGRATE_IMAGE' APP_VERSION='$DEPLOY_SHA' API_DOMAIN='$API_DOMAIN' \
             && docker pull --quiet '$MIGRATE_IMAGE' \
             && docker compose --env-file backend.env run --rm migrate \
             && docker compose --env-file backend.env up -d --pull always"

          remove_unused_images

          # `up -d` succeeds as soon as the container starts, and with
          # `restart: unless-stopped` a crash-looping backend still reads as
          # running, so check the restart count too and surface its own error
          # instead of the 502 Caddy reports for it. A container failing this
          # is under 30s old, so its logs are startup output plus at most a few
          # request lines (method and path only): safe for this public log.
          ssh "$DROPLET" bash -s <<'EOF'
          for _ in $(seq 1 15); do
            sleep 2
            state=$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' boutline-backend)
            if [ "$state" = "true 0" ]; then
              continue
            fi
            echo "::error::boutline-backend did not stay up (running, restarts: ${state}). Last lines:"
            docker logs --tail 50 boutline-backend 2>&1
            exit 1
          done
          EOF

      # Matching the version, not just a 200, proves the NEW container is the
      # one answering -- the old one stays healthy until it is replaced. The
      # frontend must never go live against a backend that failed to start.
      - name: Wait for the backend to be healthy
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            version=$(curl -fsS "https://${API_DOMAIN}/healthcheck" | jq -r .version || true)
            if [ "$version" = "$DEPLOY_SHA" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://${API_DOMAIN}/healthcheck never reported version ${DEPLOY_SHA}"
          exit 1

      # Asking the backend directly over `edge` separates a backend that never
      # came up from Caddy failing to route or provision TLS for it. No
      # container logs here: this repo's Actions logs are public, and once the
      # backend has served traffic its logs and Postgres's can hold user data.
      - name: Show droplet diagnostics
        if: failure()
        env:
          DROPLET: ${{ vars.DROPLET_USER }}@${{ vars.DROPLET_HOST }}
        run: |
          ssh "$DROPLET" bash -s <<'EOF'
          docker inspect -f '{{.Name}} {{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} {{.State.Error}}' \
            boutline-backend boutline-db boutline-redis
          echo "::group::/healthcheck from inside the edge network, bypassing Caddy"
          docker run --rm --network edge curlimages/curl:8.11.1 -sS -m 5 http://boutline-backend:8000/healthcheck
          echo "::endgroup::"
          EOF

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      # Git deploys of main are disabled in frontend/vercel.json, so this is the
      # only way production changes. `vercel pull` fetches the project settings
      # and Production env vars (API_PROXY_TARGET included) that the build reads.
      - name: Build and deploy the frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@60.1.3 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@60.1.3 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@60.1.3 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Summarize
        run: |
          {
            echo "### Deployed to production"
            echo ""
            echo "- Ref: \`${{ github.event.release.tag_name || inputs.ref }}\` (\`${DEPLOY_SHA:0:7}\`)"
            echo "- API: https://${{ vars.API_DOMAIN }}"
            echo "- Frontend: ${{ vars.PUBLIC_FRONTEND_URL }}"
          } >> "$GITHUB_STEP_SUMMARY"
