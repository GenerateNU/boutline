name: boutline

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Everything else falls back to the defaults in internal/config; only the
      # hosts differ, since the database and cache are services on the compose
      # network rather than localhost.
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Runs the integration suite (internal/tests) against the real, migrated,
  # seeded db/redis on this network — the same database `make dev-seed` loads,
  # unreachable directly from the host for the same reason as db/redis below.
  # `target: build` stops at the golang stage of ./Dockerfile instead of the
  # final distroless one, so the toolchain and source are still there to test.
  test:
    build:
      context: .
      target: build
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    # No -race here: the build stage is Alpine/musl with no C toolchain
    # installed (it's CGO_ENABLED=0 for the shipped binary), and -race needs
    # cgo. CI runs the same package with -race on a normal Go toolchain.
    command: ["go", "test", "./internal/tests/..."]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Applies pending migrations once, between the database being ready and the
  # api starting. Generate them first with `make migrate-new NAME=...`.
  migrate:
    image: arigaio/atlas:1.3.3-community-alpine
    environment:
      ATLAS_URL: postgres://postgres:postgres@db:5432/boutline?sslmode=disable
    entrypoint: ["/bin/sh", "-c"]
    command: ['atlas migrate apply --dir file:///migrations --url "$$ATLAS_URL"']
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: boutline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Not published to the host, so a local Postgres on 5432 does not clash.
    # Reach it with `make dev-psql`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boutline"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4.2-alpine
    # No volume: this is a cache, so losing its contents on restart is fine,
    # and not published to the host for the same reason as db.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
